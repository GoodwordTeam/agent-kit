# The same gates .no-mistakes.yaml runs as test and lint, on GitHub's runner.
# Firstmate is never installed here: the adapter tests use temp-dir fixtures,
# and anything that needs a real Firstmate clone runs outside CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run validate
      - run: bun run build
