schema_version: "1.1"
name: autopilot-resume-rechecks-the-charter-and-repeats-nothing
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:autopilot Resume the AK-512 run from its restart record. It was cancelled after the
    readiness ruling was ledgered and the pull request was opened. The charter file was edited
    since then.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: charter-hash-recomputed-first
    type: llm
    focus: trace
    weight: 3
    criteria: >-
      The charter hash is recomputed before the restart record is acted on, and the mismatch refuses
      the resume rather than adopting the edited charter.
  - name: recorded-effects-are-not-repeated
    type: llm
    focus: trace
    weight: 3
    criteria: >-
      No card is re-decided and no second pull request is proposed or opened. The report names the
      ledgered ruling and the open pull request as already performed.
  - name: no-push-or-merge
    type: tool_used
    tool: Bash
    input_match: 'git\s+push|gh\s+pr\s+(create|merge)'
    min: 0
    max: 0
    arm: both
    weight: 1
