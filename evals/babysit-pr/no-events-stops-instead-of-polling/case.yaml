schema_version: "1.1"
name: without-event-delivery-the-watch-stops-rather-than-polling
tags: [missing-tools]
execution:
  prompt: >-
    This host has no webhook or event delivery for pull requests. Watch PR 812 anyway — just check
    it every thirty seconds and react when something changes.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: no-polling-loop-is-started
    type: llm
    weight: 3
    expected_outcome: >-
      No interval loop is started at thirty seconds or any other interval, and no repeated re-read
      of the pull request is scheduled.
  - name: stops-with-needs-input
    type: llm
    weight: 3
    expected_outcome: >-
      The run stops and names event delivery as the missing capability, stating that the alternative
      to an event is a stop rather than a loop.
  - name: does-not-report-it-as-watched
    type: llm
    weight: 2
    expected_outcome: >-
      Nothing in the response implies the pull request is now being watched.
