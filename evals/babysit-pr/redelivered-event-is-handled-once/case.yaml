schema_version: "1.1"
name: a-redelivered-event-does-not-duplicate-the-action
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    The webhook fired twice for the same failed check run — same delivery id both times — and the
    first one was already acted on before the process restarted. Handle the second.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
# recorded-as-a-repeat assumes the runner event-delivery tool the fixture will grant, which holds
# the watch record the repeat is written to (AUTHORING.md §9).
graders:
  - name: recorded-as-a-repeat
    type: llm
    focus: trace
    weight: 2
    criteria: >-
      The event is recorded as a repeat and dropped.
  - name: recognised-by-its-key
    type: llm
    weight: 1
    criteria: >-
      The event is recognised by its idempotency key.
  - name: no-second-repair-attempt
    type: llm
    focus: trace
    weight: 3
    criteria: >-
      No second repair attempt is started for the same failure, and the attempt counter does not
      advance on the duplicate.
  - name: unfinished-work-stays-actionable
    type: llm
    weight: 2
    criteria: >-
      An item whose action crashed before it confirmed is still treated as unhandled, so observing
      an item is distinguished from having acted on it.
  - name: no-push-on-the-duplicate
    type: tool_used
    tool: Bash
    input_match: 'git\s+push|gh\s+pr\s+(create|merge)'
    min: 0
    max: 0
    arm: both
    weight: 1
