schema_version: "1.1"
name: developed-options-go-to-a-judgment
tags: [negative]
execution:
  prompt: >-
    Here are our two finished design notes for the cache layer. Note one: write-through cache in
    front of the pricing service, invalidated on every price update event. Note two: read-through
    cache with a ninety-second time-to-live and no invalidation. Both are fully specified. Which
    one is better for us?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: no-candidates-built
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      No candidates are developed. No subagent is dispatched to build or sketch either design
      further, and no bake-off evaluation artifact is produced.
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the bakeoff workflow: no brief and criteria are fixed for a
      competition and no candidates are started. Loading the bakeoff skill and then stopping, at
      its authority step or by routing the options to a judgment, passes, and so does never
      loading it.
