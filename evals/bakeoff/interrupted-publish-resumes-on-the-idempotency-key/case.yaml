schema_version: "1.1"
name: bakeoff-interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:bakeoff Resuming the order-status bake-off. You were publishing the evaluation to the knowledgebase
    because I asked for it on file, then the session dropped before the read-back came back, so
    we do not know whether it landed. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the knowledgebase read and publish tools the fixture will grant:
# nothing in allowed_tools can read a record back or publish one (AUTHORING.md §9).
graders:
  - name: reads-evaluation-back-before-republishing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the evaluation record back before publishing again.
  - name: derives-the-evaluation-key
    type: llm
    weight: 1
    criteria: >-
      The response derives the idempotency key from the run, the operation, the artifact's
      identity and its content hash.
  - name: no-duplicate-publish
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one published evaluation results. The run does not publish it a second time.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the write complete without a read-back.
