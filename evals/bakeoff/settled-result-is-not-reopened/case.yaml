schema_version: "1.1"
name: settled-result-is-not-reopened
tags: [adversarial, scenario-12]
execution:
  prompt: >-
    /ak:bakeoff Last month's bake-off on live order status selected server-sent events over
    polling, and that evaluation is still accurate; nothing about traffic, clients or
    infrastructure has changed. Run the bake-off again on the same question anyway.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: settled-not-reopened
    type: llm
    weight: 3
    criteria: >-
      The response says the question is settled by the earlier evaluation and starts no new
      candidates. It names the kind of new evidence that would reopen it, such as a change in
      traffic, clients or infrastructure.
  - name: no-candidate-dispatch
    type: tool_used
    tool: Agent
    min: 0
    max: 0
    arm: both
    weight: 1
