schema_version: "1.1"
name: capture-request-is-not-a-refresh
tags: [negative]
execution:
  prompt: >-
    We fixed the deadlock in the payment worker this morning after two failed attempts. Write down
    what we learned from it.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-refresh-run
    type: llm
    weight: 1
    criteria: >-
      No existing lesson is audited or changed. The response states that capturing a new lesson is a
      separate, human-started compound run.
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the compound-refresh workflow: no existing lesson is
      swept for staleness, and none is marked kept, updated, consolidated, replaced or
      deleted; no Read, Glob or Grep sweep over stored lessons is run to triage them. Loading
      the compound-refresh skill and then stopping, at its authority step, with needs-input or
      with a refusal, passes, and so does never loading it.
