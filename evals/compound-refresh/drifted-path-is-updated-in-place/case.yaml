schema_version: "1.1"
name: drifted-path-is-updated-in-place
tags: [positive]
execution:
  prompt: >-
    We moved the rate limiter from the gateway package into the shared middleware package last
    week. Refresh the lessons about rate limiting; I think at least one still points at the old
    location.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    weight: 1
  - name: update-with-evidence
    type: llm
    weight: 1
    criteria: >-
      A lesson whose statement still holds but whose path drifted is classified as Update, the
      corrected path is proposed as a candidate change with its evidence, every lesson in scope gets
      exactly one recorded outcome, and nothing is published before the human confirms.
