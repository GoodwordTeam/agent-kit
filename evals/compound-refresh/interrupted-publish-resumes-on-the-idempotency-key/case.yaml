schema_version: "1.1"
name: compound-refresh-interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    Resuming the refresh. I confirmed the supersession of the old session-cookie lesson, it was sent
    to the knowledgebase, and the session dropped before the read-back returned. Pick it up.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-publishing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The response derives the idempotency key from the run, the operation, the lesson identity and
      the artifact hash, and reads the lesson back before any second publish.
  - name: no-duplicate-supersession
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The supersession is published at most once.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the supersession complete without a read-back.
