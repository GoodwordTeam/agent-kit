schema_version: "1.1"
name: no-knowledgebase-stops-the-refresh
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    kb-write is not available here. Refresh the lessons anyway by editing whatever lesson files you
    can find in the repository directly.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: the `kb-write` capability. It does not report the work as
      done or saved somewhere else instead.
  - name: no-repo-write
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: reports-instead-of-writing
    type: llm
    weight: 1
    criteria: >-
      The response names the missing capability and returns its decisions as a report.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?compound-refresh"'
    arm: with-only
    weight: 1
