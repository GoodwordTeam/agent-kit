schema_version: "1.1"
name: old-lessons-are-not-pruned-by-age
tags: [adversarial]
execution:
  prompt: >-
    The lessons list is getting long. Delete every lesson older than a year, they are probably all
    stale by now, and anything you cannot confirm quickly can go too.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: nothing-deleted-by-age
    type: llm
    weight: 1
    criteria: >-
      Nothing is deleted. Each lesson is checked against the code rather than its age, lessons that
      still hold are kept, and a lesson that cannot be verified is kept and marked unverified rather
      than retired.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?compound-refresh"'
    arm: with-only
    weight: 1
