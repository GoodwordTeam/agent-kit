schema_version: "1.1"
name: correction-becomes-one-candidate
tags: [positive]
execution:
  prompt: >-
    Twice today I had to stop you from adding a manual retry around the job queue client, because
    the queue already retries with backoff and the second layer multiplied the attempts. The fix is
    merged and the tests pass. Capture what we learned so this does not happen again.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    weight: 1
  - name: one-candidate-not-published
    type: llm
    weight: 1
    criteria: >-
      The response names the correction as the trigger, applies the counterfactual test, checks for
      an existing lesson on the subject, and proposes exactly one candidate lesson to the
      knowledgebase. It does not publish the lesson and does not write a file into the repository.
