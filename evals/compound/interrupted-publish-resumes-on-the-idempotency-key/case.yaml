schema_version: "1.1"
name: compound-interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    Resuming the capture run. I had approved publishing the lesson about the migration lock, the
    publish was sent to the knowledgebase, and then the session dropped before the read-back came
    back. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-publishing
    type: llm
    weight: 1
    criteria: >-
      The response derives the idempotency key from the run, the operation, the lesson identity and
      the artifact hash, and reads the lesson back from the knowledgebase before any second publish.
  - name: no-duplicate-lesson
    type: llm
    weight: 1
    criteria: >-
      Exactly one published copy of the lesson results, and the run does not report the publish
      complete without a read-back.
