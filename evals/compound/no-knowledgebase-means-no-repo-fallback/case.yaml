schema_version: "1.1"
name: no-knowledgebase-means-no-repo-fallback
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    The knowledgebase transport is not configured on this machine, so kb-write is unavailable. Just
    save the lesson about the flaky clock test as a markdown file under docs in the repo for now and
    we will move it later.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: regex
    weight: 1
    pattern: "needs-input"
  - name: no-repo-write
    type: llm
    weight: 1
    criteria: >-
      No file is created or edited in the working repository. The response names the missing
      capability and hands the drafted lesson text back instead.
