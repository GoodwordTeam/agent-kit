schema_version: "1.1"
name: smooth-run-produces-no-lesson
tags: [negative, scenario-23]
execution:
  prompt: >-
    That export feature took all afternoon but it went exactly to plan: no failures, no review
    surprises, nothing you got wrong. It was a long one though, so capture a lesson from it.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-manufactured-lesson
    type: llm
    weight: 1
    criteria: >-
      No lesson is drafted or proposed. The response reports that no failure, correction or
      surprising review result qualifies, and states that effort or length is not evidence.
