schema_version: "1.1"
name: deprecate-interrupted-adr-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:deprecate Resuming the /v1/orders retirement. The decision record and the notice page were
    sent to the knowledgebase, then the session dropped before the read-back came back. Carry on
    from there.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the knowledgebase read and publish tools the fixture will grant:
# nothing in allowed_tools can read a record back or publish one (AUTHORING.md §9).
graders:
  - name: reads-back-both-before-republishing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the decision record and the notice page back from the knowledgebase before
      publishing again.
  - name: derives-the-idempotency-key
    type: llm
    weight: 1
    criteria: >-
      The response derives the idempotency key from the run, the operation, the record
      identity and the artifact hash to decide whether the earlier publish of the decision
      record and the notice page landed.
  - name: no-second-adr-or-notice
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one proposed decision record and one notice page exist for the /v1/orders
      retirement. The run reuses the ones already published rather than publishing a second of
      either.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the publish complete without a read-back.
