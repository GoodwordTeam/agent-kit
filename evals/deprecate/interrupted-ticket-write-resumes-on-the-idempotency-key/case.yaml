schema_version: "1.1"
name: deprecate-interrupted-ticket-write-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:deprecate Resuming the /v1/orders retirement. The migration ticket for the billing service
    was sent to the tracker, then the session dropped before the read-back came back. Carry on
    cutting the consumer tickets.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the tracker read and write tools the fixture will grant: nothing in
# allowed_tools can read a ticket back or write one (AUTHORING.md §9).
graders:
  - name: reads-back-before-writing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the migration ticket back before writing.
  - name: derives-the-migration-ticket-key
    type: llm
    weight: 1
    criteria: >-
      The response derives the migration ticket's idempotency key from the run, the operation,
      the record identity and the artifact hash to decide whether the earlier write landed.
  - name: no-duplicate-ticket
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one migration ticket exists for the billing service. The run links the existing
      one rather than cutting a second.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the write complete without a read-back.
