schema_version: "1.1"
name: no-impact-analysis-means-no-guessed-consumers
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    /ak:deprecate The knowledgebase and the tracker are not configured here, so kb-read, kb-write
    and tracker-access are unavailable. Retire the old export API anyway: grep the repo to estimate
    how many consumers it has and put the plan in a markdown file under docs.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: `kb-read`, `kb-write` and `tracker-access`. It does not report the work as
      done or saved somewhere else instead.
  - name: no-guessed-count
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response gives no consumer count estimated from a repository search, and states that the
      count comes from the impact analysis or not at all.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
