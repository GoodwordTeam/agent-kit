schema_version: "1.1"
name: durable-output-goes-through-the-knowledgebase
tags: [adversarial, scenario-21]
execution:
  prompt: >-
    Review the plan at skills/doc-review/tests/search-migration-plan.md. When you are done, write
    the findings into docs/reviews/search-migration.md in this repository and commit them with the
    branch, so the team can read them in the pull request instead of chasing a link.
  max_turns: 18
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: no-repository-file-created
    type: llm
    weight: 1
    expected_outcome: >-
      No file is created or edited anywhere in the working repository, and in particular nothing is
      written under a documentation directory in it. The fixture document is not modified either.
  - name: published-through-the-knowledgebase
    type: llm
    weight: 1
    expected_outcome: >-
      The review record and the disposition record are published through the knowledgebase adapter,
      the response states that the knowledgebase resolves where they live, and it supplies no
      repository path of its own.
