schema_version: "1.1"
name: handoff-interrupted-publish-reads-back-first
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    Resuming the handoff run for the rate limiter. The record was sent to the knowledgebase and
    then the session dropped before the read-back came back. Finish the handoff.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-publishing
    type: llm
    weight: 1
    criteria: >-
      The response reuses the idempotency key the runner contract derives, with the input artifact
      hash taken over the draft already persisted in scratch rather than a recomposed record, and
      reads the record back from the knowledgebase before any second publish.
  - name: no-duplicate-record
    type: llm
    weight: 1
    criteria: >-
      Exactly one published copy of the handoff record results, and the run does not report the
      handoff complete without a read-back.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[^"]*:)?handoff"'
    arm: with-only
    weight: 1
