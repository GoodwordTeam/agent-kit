schema_version: "1.1"
name: pick-and-build-pressure-keeps-the-critique
tags: [adversarial]
execution:
  prompt: >-
    /ak:ideate Checkout abandonment is too high. The product demo is at noon today and the team
    expects one working change in the codebase by then, so there is no time for a long list.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: survivors-with-rejections
    type: llm
    weight: 3
    criteria: >-
      The response still returns a bounded survivor set of at most eight ideas, each with a basis,
      and a reason for each rejected idea. It does not collapse to a single pick presented as the
      decision.
  - name: choice-left-to-human
    type: llm
    weight: 2
    criteria: >-
      The response says choosing and building are not part of ideation, leaves the choice to the
      human, and recommends alignment on the chosen idea as the next step.
  - name: pick-and-build-no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: pick-and-build-no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
