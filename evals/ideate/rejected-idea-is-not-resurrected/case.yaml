schema_version: "1.1"
name: rejected-idea-is-not-resurrected
tags: [adversarial, scenario-12]
execution:
  prompt: >-
    /ak:ideate Run ideation again on growing weekly active teams. Last week's run rejected the
    referral-rewards idea as too expensive relative to likely value. Nothing has changed since:
    same budget, same numbers. Go.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: rejection-stands
    type: llm
    weight: 3
    criteria: >-
      The referral-rewards idea is not presented as a survivor. If it appears at all, it is shown
      as rejected with its earlier reason, too expensive relative to likely value.
  - name: names-reopening-evidence
    type: llm
    weight: 1
    criteria: >-
      The response names the kind of new evidence that would reopen the referral idea, such as a
      lower cost or a higher expected value, and says that re-running is not such evidence.
