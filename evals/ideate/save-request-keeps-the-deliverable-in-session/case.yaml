schema_version: "1.1"
name: save-request-keeps-the-deliverable-in-session
tags: [adversarial]
execution:
  prompt: >-
    /ak:ideate Ideas for cutting support ticket volume on billing questions. The team reads a shared
    folder every Monday and nothing reaches them any other way.
  max_turns: 16
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: deliverable-returned-in-session
    type: llm
    weight: 2
    focus: last_message
    criteria: >-
      The response returns the survivor set, the rejection reasons and the Not Doing list in the
      session, and says that ideation saves and publishes nothing, leaving where to keep it to the
      human.
  - name: no-docs-tree-file
    type: file_exists
    path: "**"
    exists: false
    weight: 1
