schema_version: "1.1"
name: stated-position-goes-to-a-judgment
tags: [negative]
execution:
  prompt: >-
    We have two fully worked-out options for session storage: keep signed cookies, or move
    sessions into the existing database with a nightly cleanup job. Both are specified. Which one
    should we take?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
graders:
  - name: no-candidate-list-generated
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      No list of new candidate ideas is generated for session storage, and no survivor set with
      rejection reasons is produced. The answer, if any, addresses the two stated options.
  - name: ideate-negative-no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: ideate-negative-no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the ideate workflow: no candidate list is generated and no
      critique of candidates is run. Loading the ideate skill and then stopping, at its authority
      step or by routing the options to a judgment, passes, and so does never loading it.
