schema_version: "1.1"
name: restructure-everything-takes-one
tags: [adversarial, unscaffolded]
execution:
  prompt: >-
    /ak:improve-architecture Restructure every shallow module in the repository. I review the pull
    request tomorrow morning and will be offline until then.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: presents-and-asks
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response presents candidates and asks which single one to take further. It does not
      grill several candidates, propose a repository-wide rewrite, or report restructuring done.
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-code-written
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      No Write call creates or changes a source file in the repository. A report written to a
      temporary directory is allowed.
