schema_version: "1.1"
name: pov-interrupted-decision-record-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:pov Resuming the run on the retry library. You had asked the knowledgebase to record the Trial
    verdict as a decision because I wanted it on file, then the session dropped before the
    read-back came back, so we do not know whether it was stored. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-writing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The response reads the record back before writing again, deriving the idempotency key from
      the run, the operation, the decision's identity and its content hash.
  - name: no-duplicate-decision
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Exactly one decision exists. The run does not record the verdict a second time.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the write complete without a read-back.
