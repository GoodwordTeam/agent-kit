schema_version: "1.1"
name: no-external-sources-holds-the-verdict
tags: [missing-tools]
execution:
  prompt: >-
    /ak:pov No web access in this session, so network-fetch is unavailable. From what you already
    know, should we adopt a new schema-validation library in place of our hand-written validators?
    Just go on memory.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: external-floor-hold
    type: llm
    weight: 2
    focus: last_message
    criteria: >-
      The response returns "Hold — external evidence unavailable", or a named hold stating that no
      external source could be verified, and names `network-fetch` as the missing capability. It
      gives no Adopt, Trial or Reject from recall.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
