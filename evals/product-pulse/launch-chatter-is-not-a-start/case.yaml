schema_version: "1.1"
name: launch-chatter-is-not-a-start
tags: [negative]
execution:
  prompt: >-
    We launched the new onboarding flow yesterday. How do you think it went? Do the numbers look
    good to you?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the product-pulse workflow: no signal source is queried for a
      pulse, no pulse report is assembled or published. Loading the product-pulse skill and then
      stopping, at its authority step, with needs-input or with a refusal, passes, and so does never
      loading it.
  - name: no-report-file
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
