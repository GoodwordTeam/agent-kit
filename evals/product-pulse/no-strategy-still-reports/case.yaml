schema_version: "1.1"
name: no-strategy-still-reports
tags: [positive, needs-fixture]
execution:
  prompt: /ak:product-pulse 7d
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: says-no-strategy
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      The report states that no strategy is on record and carries no strategy metrics forward. It
      still reports usage and followups.
  - name: no-invented-anchor
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      The run does not invent key metrics, goals or targets that no strategy or configuration named,
      and does not label any number as good or bad against an invented anchor.
