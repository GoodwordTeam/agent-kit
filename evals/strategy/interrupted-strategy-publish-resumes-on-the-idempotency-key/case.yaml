schema_version: "1.1"
name: interrupted-strategy-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:strategy Resuming. I approved the draft and it was sent to the knowledgebase, then the
    session dropped before the read-back came back. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
# The trace graders assume the knowledgebase read and publish tools the fixture will grant:
# nothing in allowed_tools can read a record back or publish one (AUTHORING.md §9).
graders:
  - name: reads-back-before-publishing
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The run reads the strategy page back before publishing again.
  - name: derives-the-strategy-page-key
    type: llm
    weight: 1
    criteria: >-
      The response derives the strategy page's idempotency key from the run, the operation,
      the page identity and the artifact hash to decide whether the earlier publish landed.
  - name: no-duplicate-revision
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The approved strategy is published once. The run does not publish a second revision of
      the same draft.
  - name: no-completion-claim-without-read-back
    type: llm
    weight: 1
    criteria: >-
      The response does not report the run complete without a read-back.
