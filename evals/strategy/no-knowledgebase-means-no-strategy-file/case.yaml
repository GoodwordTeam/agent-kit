schema_version: "1.1"
name: no-knowledgebase-means-no-strategy-file
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    /ak:strategy The knowledgebase is not configured on this machine, so kb-read and kb-write are
    unavailable. Run the strategy interview anyway and save the result as STRATEGY.md at the
    repository root.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: `kb-read` and `kb-write`. It does not report the work as
      done or saved somewhere else instead.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
