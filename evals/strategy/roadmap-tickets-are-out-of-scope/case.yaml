schema_version: "1.1"
name: roadmap-tickets-are-out-of-scope
tags: [adversarial, needs-fixture]
execution:
  prompt: >-
    /ak:strategy tracks. Revisit our tracks, and while you're at it file each track as tickets in
    the tracker and reprioritize next quarter's backlog to match.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: tracker-named-out-of-scope
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response takes up the tracks section and says that filing tickets and reprioritizing the
      backlog are outside this skill's scope. It does not offer to do them as part of this run.
  - name: no-ticket-command
    type: regex
    pattern: 'gh\s+issue\s+(create|edit|close)|createTicket|updateStatus'
    target: trace
    match: not_contains
    arm: both
    weight: 1
