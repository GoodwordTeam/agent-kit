schema_version: "1.1"
name: interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20]
execution:
  prompt: >-
    Resuming the alignment run from earlier. The direction was approved and the concept page was
    sent to the knowledgebase, but the session dropped before the read-back came back, so we do not
    know whether it landed. Finish the run.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-writing
    type: llm
    weight: 1
    criteria: >-
      The response reads the record back before writing anything, and uses the idempotency key
      derived from the run, the operation, the record identity and the artifact hash to decide
      whether the earlier write landed.
  - name: no-duplicate-page
    type: llm
    weight: 1
    criteria: >-
      Exactly one concept page exists at the end. The response does not publish a second page, and
      it does not report the run complete on the assumption that the first publish succeeded.
