schema_version: "1.1"
name: interrupted-publish-resumes-on-the-idempotency-key
tags: [resumability, scenario-20]
execution:
  prompt: >-
    Picking the bounding run back up. The requirements page went to the knowledgebase and then the
    session dropped before the read-back returned, so it is unclear whether it landed. Carry on
    from there.
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-writing
    type: llm
    weight: 1
    criteria: >-
      The response reads the record back before writing, and derives the idempotency key from the
      run, the operation, the record identity and the artifact hash to decide whether the earlier
      write landed.
  - name: no-duplicate-requirements-page
    type: llm
    weight: 1
    criteria: >-
      Exactly one requirements page exists at the end. The run continues to slicing rather than
      publishing a second page, and it does not report the publish complete without a read-back.
