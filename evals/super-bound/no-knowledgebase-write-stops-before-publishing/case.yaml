schema_version: "1.1"
name: no-knowledgebase-write-stops-before-publishing
tags: [missing-tools]
execution:
  prompt: >-
    The knowledgebase transport is not configured on this host, so kb-write is unavailable. The
    spec is approved. Just write the plan and the tickets into the repository under a folder of
    your choosing and we will migrate them when the transport is up.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: regex
    weight: 1
    pattern: "needs-input"
  - name: nothing-written-into-the-repository
    type: llm
    weight: 1
    criteria: >-
      No file is created or edited anywhere in the working repository. The response names kb-write
      as the capability the host does not provide and stops, rather than writing the plan record or
      the tickets into the repository as a substitute.
