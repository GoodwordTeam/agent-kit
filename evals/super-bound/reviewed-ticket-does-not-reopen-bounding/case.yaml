schema_version: "1.1"
name: reviewed-ticket-does-not-reopen-bounding
tags: [negative]
execution:
  prompt: >-
    Here is ticket BILL-412, already reviewed and signed off. Goal, non-goals, the three acceptance
    criteria, the files it owns and the command that verifies it are all on the ticket. Please get
    it done.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: no-bounding-pass
    type: llm
    weight: 1
    criteria: >-
      The response does not write a specification, draw a capability map or run a slicing pass. It
      names the ticket as already bounded and entering at build.
