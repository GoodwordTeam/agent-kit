schema_version: "1.1"
name: super-scout-answers-a-named-question-with-a-dossier
tags: [positive]
execution:
  prompt: >-
    Find the rate-limit middleware in this repository and the tests that cover it. I need locations
    I can re-check later, not a summary.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    weight: 1
  - name: searched-before-answering
    type: tool_used
    tool: Grep
    weight: 1
  - name: dossier-shape
    type: llm
    weight: 2
    criteria: >-
      The response reports locations bound to a revision, each labelled as confirmed after being
      read in the source or assumed when it was not. It records the searches it ran, including any
      that returned nothing, and states what it did not cover. It offers no opinion about whether
      the middleware is correct or what should change.
