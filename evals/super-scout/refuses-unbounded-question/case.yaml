schema_version: "1.1"
name: super-scout-refuses-an-unbounded-brief
tags: [negative]
execution:
  prompt: "Understand the authentication system in this repository and tell me how it all works."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: refuses-and-rescopes
    type: llm
    weight: 3
    criteria: >-
      The response does not begin an exploration and does not produce a dossier. It states that the
      brief has no named question and therefore no completion condition, and it proposes one or
      more narrower questions for the caller to choose from before anything is searched.
  - name: stopped-at-authority
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      Either no Skill tool call in the trace loads the super-scout skill, or the run loads it and then
      stops with needs-input or a refusal. In both cases the run takes no side-effect action: it
      edits or writes no file, pushes nothing, and opens or changes no ticket or pull request.
