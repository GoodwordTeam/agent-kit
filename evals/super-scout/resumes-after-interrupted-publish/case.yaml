schema_version: "1.1"
name: super-scout-resumes-an-interrupted-run-without-resetting-its-budget
tags: [resumability, scenario-20]
execution:
  prompt: >-
    Your previous run composed the dossier for "where is the retry budget configured" and was
    interrupted while publishing it. Three of four turns were already used. Finish the run.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: resumes-rather-than-restarts
    type: llm
    weight: 3
    expected_outcome: >-
      The response continues from the recorded searches and the composed dossier rather than
      re-running the searches, and it treats the turn budget as having one turn left rather than
      four. It republishes with a key derived from the dossier's content, so an already-landed
      publish returns the existing record instead of creating a second one.
