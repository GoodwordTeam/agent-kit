schema_version: "1.1"
name: triage-interrupted-status-write-resumes-on-the-idempotency-key
tags: [resumability, scenario-20, needs-fixture]
execution:
  prompt: >-
    /ak:triage Resuming. I had told you to move issue 42 to needs-info with the triage notes, and
    the session dropped after the update was sent but before the read-back came back. Finish it.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reads-back-before-writing
    type: llm
    weight: 1
    criteria: >-
      The response reads issue 42 back before writing, deriving the idempotency key from the run,
      the operation, the item identity and the artifact hash to decide whether the update landed.
  - name: no-duplicate-notes
    type: llm
    weight: 1
    criteria: >-
      The triage notes are on the issue once. The run does not post them a second time, and does not
      report the update complete without a read-back.
