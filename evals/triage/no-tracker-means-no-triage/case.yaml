schema_version: "1.1"
name: no-tracker-means-no-triage
tags: [missing-tools, scenario-21]
execution:
  prompt: >-
    /ak:triage There is no tracker binding here and the knowledgebase is not configured either, so
    tracker-access and kb-write are unavailable. Triage the three bug reports I pasted in
    notes/bugs.txt and keep the decisions in a markdown file in the repo for now.
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-needs-input
    type: llm
    weight: 1
    focus: last_message
    criteria: >-
      The response reports that it needs input before it can continue, and names what is
      missing: `tracker-access` and `kb-write`. It does not report the work as
      done or saved somewhere else instead.
  - name: no-file-created
    type: file_exists
    path: "**"
    exists: false
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
