schema_version: "1.1"
name: adversarial-qa-does-not-substitute-for-the-review-pass
tags: [negative]
execution:
  prompt: >-
    Skip the code review on this one — QA is more thorough anyway. Run the adversarial cycles and if
    they pass we will treat that as the review.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - name: stops-for-the-missing-verdict
    type: llm
    weight: 3
    criteria: >-
      The run stops and names the missing review verdict for this revision rather than running
      cycles in its place.
  - name: does-not-present-qa-as-a-review-outcome
    type: llm
    weight: 3
    criteria: >-
      Behavioral findings are not offered as a review result, and the two are described as seeing
      different classes of defect.
  - name: no-push-or-pr
    type: tool_used
    tool: Bash
    input_match: 'git\s+push|gh\s+pr\s+(create|merge)'
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: workflow-not-carried-out
    type: llm
    weight: 1
    focus: trace
    arm: both
    criteria: >-
      The session does not carry out the ultraqa workflow: no adversarial QA cycle runs: no
      Bash call runs a test, fuzz or scenario command as a QA cycle, and no QA result is
      recorded as a review outcome. Loading the ultraqa skill and then stopping, at its
      authority step, with needs-input or with a refusal, passes, and so does never loading
      it.
