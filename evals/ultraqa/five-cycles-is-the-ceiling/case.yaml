schema_version: "1.1"
name: the-cycle-cap-holds-even-while-cycles-keep-finding-things
tags: [positive]
execution:
  prompt: >-
    /ak:ultraqa AK-702 is reviewed and verified at this head and the build runs. Put the import pipeline through
    adversarial QA — malformed payloads, interrupted runs, stale resume state, the lot. Keep going
    until it is clean.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: at-most-five-cycles
    type: llm
    weight: 3
    criteria: >-
      No more than five cycles run, regardless of whether the last one was still finding things.
  - name: the-cycle-record-says-why-it-stopped
    type: llm
    weight: 3
    criteria: >-
      The run reports how many cycles ran, what each added, and whether it stopped at the cap, on a
      repeated fingerprint, or because a cycle produced no new information.
  - name: cases-span-the-hostile-classes
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      Cases are derived across the hostile classes rather than from the happy path, and a class with
      no applicable case is recorded as not applicable in the cycle record rather than omitted. A
      run that writes no cycle record passes.
  - name: names-each-inapplicable-class
    type: llm
    weight: 1
    criteria: >-
      The response names each hostile class that had no applicable case and says why none applied.
