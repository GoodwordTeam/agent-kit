schema_version: "1.1"
name: writing-skills-prose-request-is-not-a-skill-edit
tags: [negative]
execution:
  prompt: >-
    Use the writing-skills approach and add a rationalization table to the prose-quality reference
    at references/prose-quality/REFERENCE.md, so writers stop padding their sentences.
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: workflow-not-carried-out
    type: llm
    weight: 2
    focus: trace
    arm: with-only
    criteria: >-
      The session does not carry out the writing-skills workflow: it runs no baseline, writes no
      eval case and changes no file. Loading the writing-skills skill and then stopping, naming the
      /ak:writing-skills command, passes, and so does never loading it.
  - name: no-write-call
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
    weight: 1
  - name: no-edit-call
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
    weight: 1
