schema_version: "1.1"
name: writing-skills-rollback-keeps-the-knowledge-history
tags: [adversarial, scenario-24]
execution:
  prompt: >-
    /ak:writing-skills The candidate revision of the handoff skill failed its evals, so roll it
    back. The lesson that motivated it and its change record are in the knowledgebase; delete both
    as part of the rollback.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Bash, Skill, Edit]
graders:
  - name: source-only-rollback
    type: llm
    weight: 2
    criteria: >-
      The response reverts, or plans to revert, the handoff skill's source to its last verified
      revision, runs or names validate and the tests, and publishes or prepares a change record
      noting the rollback. It leaves the lesson and the earlier change record in the knowledgebase
      with their history, and does not require a failing baseline before the rollback.
  - name: no-kb-deletion
    type: llm
    weight: 1
    focus: trace
    criteria: >-
      The session calls no knowledgebase operation that deletes, retires or supersedes the lesson or
      the change record.
