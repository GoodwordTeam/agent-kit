tests:
  - id: response-field-type-change
    kind: positive
    given: A serializer changes an existing response field from a number to a string.
    expect: Attaches on public-boundary-shape.
    fixture: packs/pack-api/tests/response-field-type-change
  - id: charge-endpoint-no-key
    kind: positive
    given: A new state-changing charge endpoint with no idempotency key handling.
    expect: Attaches on state-changing-endpoint-retry.
    fixture: packs/pack-api/tests/charge-endpoint-no-key
  - id: export-callers-unknown
    kind: positive
    given: A new exported function whose callers the selector cannot see.
    expect: Attaches on public-signature-with-callers, recording the ambiguity in the rationale.
    fixture: packs/pack-api/tests/export-callers-unknown
  - id: internal-refactor
    kind: negative
    given: A private helper is renamed inside one module and its only caller updated.
    expect: Does not attach.
    fixture: packs/pack-api/tests/internal-refactor
  - id: cleanup-claim-on-route
    kind: adversarial
    given: The PR body says internal cleanup only, while the diff renames a response field.
    expect: Attaches on public-boundary-shape; the description does not suppress it.
    fixture: packs/pack-api/tests/cleanup-claim-on-route
