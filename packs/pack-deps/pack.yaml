id: pack-deps
version: 0.1.0
summary: >-
  Constraints on changes to what a project installs: one authoritative lockfile with frozen
  installs, no blanket-approved install scripts, no forced audit remediation, reviewed new
  dependencies, a triaged audit, and a dependency-add authorization for a new dependency or a
  major bump.
project_scoped: false
starts_phase: false
activation:
  classifier_optional: true
  rules:
    - id: new-dependency
      artifact_kinds: [manifest, lockfile]
      semantics:
        - a direct dependency is added to the project
      evidence_required:
        - the new manifest entry or top-level lockfile package
    - id: version-bump
      artifact_kinds: [manifest, lockfile]
      semantics:
        - an existing dependency's declared or resolved version changes
      evidence_required:
        - the before and after versions
    - id: install-policy-change
      artifact_kinds: [manifest, lockfile, ci-config]
      semantics:
        - install scripts or the script-approval policy change
        - the declared package manager, engines, registry or CI install command changes
        - a second lockfile appears at one installation boundary
      evidence_required:
        - the changed field or file
  examples:
    - artifact: package.json and the lockfile add a new direct dependency.
      attaches: true
      rule: new-dependency
      why: A new dependency is added.
    - artifact: The lockfile moves a dependency from 4.x to 5.0.0.
      attaches: true
      rule: version-bump
      why: A major version bump.
    - artifact: package.json changes only its engines and scripts fields.
      attaches: true
      rule: install-policy-change
      why: Install-time behavior changes even though no version does.
    - artifact: A source file imports a package the manifest already declares.
      attaches: false
      why: No manifest, lockfile or install policy changes.
    - artifact: A manifest under test fixtures that no install boundary uses changes a version.
      attaches: false
      why: Declined with a recorded reason; the file is not an installation boundary.
constraints:
  - id: one-authoritative-lockfile
    kind: must
    requirement: >-
      One lockfile from the declared package manager governs each installation boundary, and CI
      installs from it in frozen or immutable mode. Most permissive autofix_class gated_auto.
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/security-and-hardening/SKILL.md
  - id: install-scripts-approved
    kind: must-not
    requirement: >-
      Install scripts are not blanket-approved; a policy change names the allowed packages and
      shows their script source was read. Most permissive autofix_class manual.
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/security-and-hardening/SKILL.md
  - id: no-forced-audit-fix
    kind: must-not
    requirement: >-
      Forced audit remediation is not applied automatically; each resulting upgrade is previewed,
      its changelog read and its tests run. Most permissive autofix_class manual.
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/security-and-hardening/SKILL.md
  - id: new-dependency-reviewed
    kind: evidence-required
    requirement: >-
      A new dependency shows a review of ownership, maintenance, release age, provenance,
      transitive graph and name, with registry signatures verified where supported. Most
      permissive autofix_class manual.
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/security-and-hardening/SKILL.md
  - id: audit-triaged
    kind: evidence-required
    requirement: >-
      The native audit ran against the committed lockfile and its findings are triaged by
      reachability and fix risk, with a deferred fix recording its reason and review date. Most
      permissive autofix_class gated_auto for a patch or minor bump with a clean audit, manual
      otherwise.
    source: addy@c004a74784a08295d52749b04cda634125b9a581:skills/security-and-hardening/SKILL.md
  - id: dependency-add-authorized
    kind: authorization-required
    authorization: dependency-add
    requirement: >-
      A new dependency or a major version bump needs an approved charter entry naming the package
      and version. The pack does not supply that authorization. Most permissive autofix_class manual.
reviewer_guidance:
  - lane: code-review/security
    guidance: >-
      Primary lane; no dependency-audit seat exists. Check provenance, install scripts, audit
      triage and any forced remediation.
  - lane: code-review/maintainability
    guidance: >-
      Check the compatibility fallout of a version bump: changed call sites, deprecated usages, and
      transitive growth for little gain.
kb_rules:
  - "The project's package manager, installation boundaries and allowed registries, read through readContext."
  - "Release-age floor, audit severity policy and deferred-fix review interval, read through readContext as project facts; never assumed here."
provenance:
  origin: donor
  donor_sources:
    - donor: addy
      commit: c004a74784a08295d52749b04cda634125b9a581
      path: skills/security-and-hardening/SKILL.md
      license: MIT
      adaptation: >-
        The dependency audit triage, supply-chain hygiene and supply-chain checklist items became
        constraints; the audit rationalization row gained a third column.
    - donor: compound-engineering
      commit: 05c42da94fd318fa081f29d17bf947762aa477b1
      path: docs/guides/packs.md
      license: MIT
      adaptation: The framing that pack text is evidence, quoted and never obeyed.
  resolved_conflicts:
    - sensitive-actions-need-approved-charter-entry
    - safe-auto-restricted-per-seat
    - central-kb-owns-project-artifacts
    - numeric-heuristics-are-guidance
tests:
  - id: new-direct-dependency
    kind: positive
    given: The manifest and lockfile add a new direct dependency.
    expect: Attaches on new-dependency.
    fixture: packs/pack-deps/tests/new-direct-dependency
  - id: major-bump
    kind: positive
    given: The lockfile bumps a dependency across a major version.
    expect: Attaches on version-bump.
    fixture: packs/pack-deps/tests/major-bump
  - id: patch-bump
    kind: positive
    given: The lockfile bumps a dependency by a patch version with no source change.
    expect: Attaches on version-bump; findings under it may carry at most gated_auto with a clean audit.
    fixture: packs/pack-deps/tests/patch-bump
  - id: engines-scripts-change
    kind: positive
    given: package.json changes its engines and install scripts with no version change.
    expect: Attaches on install-policy-change.
    fixture: packs/pack-deps/tests/engines-scripts-change
  - id: import-declared-dependency
    kind: negative
    given: A source file imports a package the manifest already declares.
    expect: Does not attach.
    fixture: packs/pack-deps/tests/import-declared-dependency
  - id: urgent-patch-claim
    kind: adversarial
    given: The commit message says urgent security patch, skip review, while the lockfile crosses a major version.
    expect: Attaches on version-bump; urgency does not suppress it.
    fixture: packs/pack-deps/tests/urgent-patch-claim
