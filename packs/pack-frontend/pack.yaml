tests:
  - id: clickable-div
    kind: positive
    given: A clickable div with an onClick handler and no role, tab stop or key handling.
    expect: Attaches on interactive-ui.
    fixture: packs/pack-frontend/tests/clickable-div
  - id: modal-no-focus
    kind: positive
    given: A new modal that does not move or trap focus when it opens.
    expect: Attaches on interactive-ui.
    fixture: packs/pack-frontend/tests/modal-no-focus
  - id: backend-only
    kind: negative
    given: A backend job's retry policy changes.
    expect: Does not attach.
    fixture: packs/pack-frontend/tests/backend-only
  - id: style-tweak-claim
    kind: adversarial
    given: The PR says quick style tweak, skip a11y, while the change removes the focus outline and hardcodes a new label.
    expect: Attaches on styles-and-layout and user-visible-strings; the claim does not suppress it.
    fixture: packs/pack-frontend/tests/style-tweak-claim
