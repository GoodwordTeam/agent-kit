# Provenance fragment for the "judgment" batch: seven skill bodies with their manifests —
# ideate, pov, bakeoff, doubt-driven, research, source-driven and prototype.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path.
#
# Both the body and its manifest carry rows. A skill.yaml is an adapted file in its own
# right: its triggers, non-triggers, hard gates, limits and tests condense the same donor
# text the body adapts. A donor eval file is cited against the manifest only, because it
# shaped the declared tests and nothing in the body. Skill-local reference files carry
# their own rows.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below is named in research/dossiers/judgment.md and was read at its pin with
# `git show <pin>:<path>` in the pinned clone before it was written here.

