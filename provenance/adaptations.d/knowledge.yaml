      knowledgebase glossary and concept pages.

  - path: skills/wait-what/SKILL.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:docs/productivity/wait-what.md
    rationale: >-
      Wait reports the human's state rather than asking for brevity, the agent decides how far back
      "that" reaches, and a second wait does not degrade into terseness; the last becomes a gate
      and a table row.

  - path: skills/wait-what/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/wtf/SKILL.md
    rationale: >-
      Target resolution with one short question, keeping everything that changes what the reader
      would do, no claim beyond the source, and a marked correction when the original was wrong.
      The general explain-any-artifact scope is left to explain.

  - path: skills/wait-what/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/productivity/wait-what/SKILL.md
    rationale: >-
      The triggers and the project-vocabulary input condense the donor's primitive.

  - path: skills/wait-what/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:docs/productivity/wait-what.md
    rationale: >-
      The more-context-not-brevity gate and the shorter-message non-trigger condense the donor's
      design rationale.

  - path: skills/wait-what/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/wtf/SKILL.md
    rationale: >-
      The one-question limit, the no-claim-beyond-source gate and the keep-what-changes-action gate
      condense the donor's rules.

  # --- explain -------------------------------------------------------------------

  - path: skills/explain/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/SKILL.md
    rationale: >-
      Traced, inference and unknown claims; a call does not establish its uninspected
      implementation's guarantees; every claim checked before delivery; depth fitted to readers,
      not inferred from the caller; resolve discoverable facts before asking; disclose selection.
      Teaching-artifact formats and the publication destination are dropped.

  - path: skills/explain/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/references/intake.md
    rationale: >-
      Settle the subject and its readers before gathering evidence. Flag tokens and output formats
      are dropped.

  - path: skills/explain/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/references/orchestration.md
    rationale: >-
      Read the actual source; look for the decision record on a why question; code shows behavior,
      not intent; an empty search is not absence; an outside concept with no source is unverified;
      an explanation does not select an approach. Parallel gatherers and the run directory are
      dropped.

  - path: skills/explain/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/SKILL.md
    rationale: >-
      The no-recommendation, no-unread-code and no-unsourced-claim gates, the boundary non-triggers
      rewritten to this catalog's ids, and the zero-unsourced-claims limit condense the donor.

  - path: skills/explain/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/references/intake.md
    rationale: >-
      The subject and intended-readers inputs condense the donor's intake.

  - path: skills/explain/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-explain/references/orchestration.md
    rationale: >-
      The repository-revision and kb-context inputs condense the donor's evidence-gathering rules.

