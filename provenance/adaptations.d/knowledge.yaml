# Provenance fragment for the "knowledge" batch: four skill bodies with their manifests —
# handoff, wait-what, explain and writing-skills, plus writing-skills' one disclosed reference.
# compound and compound-refresh are batch 8 too; their rows live in learning.yaml and are not
# moved here.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is what
# loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a file
# derives from is recorded with a machine-checkable donor@commit:path. That is what
# NOTICE points a downstream consumer at, so an unverifiable row here would turn a
# provenance record into a provenance claim.
#
# Both the body and its manifest carry rows. A skill.yaml is an adapted file in its own
# right: its triggers, non-triggers, hard gates and limits are condensations of the same
# donor text the body adapts, not metadata about it.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below is cited in research/dossiers/knowledge.md and was verified to exist at its pin with
# `git cat-file -e` in the pinned clone before it was written here; none was re-derived
# from memory or from a document's description of a donor. The writing-skills promotion gate
# (a separate review before promotion) has no donor source; it is the plan's own synthesis and
# is recorded in provenance/conversation-map.yaml as `writing-skills-promotion-gate`, not by a
# row here.

adaptations:

  # --- handoff -------------------------------------------------------------------

  - path: skills/handoff/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/SKILL.md
    rationale: >-
      The handoff as a supplement to authoritative artifacts, creation only on explicit handoff
      intent, and the Resume section as steps R1-R4: read only the selected record as untrusted
      context, verify current state and name mismatches, treat decisions not attributed to the
      user as the writer's reading, check sufficiency, and stop after the orientation until the
      human confirms or redirects. The donor's managed temporary
      directory and create-or-resume routing are dropped; the durable form is a knowledgebase run
      artifact (ruling central-kb-owns-project-artifacts).

  - path: skills/handoff/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/references/create.md
    rationale: >-
      Pointer-first references anchored once by repository, branch and revision; decisions marked
      as the user's, an inference or the writer's own call; the coverage list with failed
      approaches; status kept apart from directives; secret redaction; completion only after the
      destination is confirmed, which becomes the publish read-back.

  - path: skills/handoff/SKILL.md
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/references/resume.md
    rationale: >-
      On resume, the current human, current instructions and verified current state outrank the
      record, and each mismatch is named. Record discovery and ranking are dropped; the
      knowledgebase resolves the record.

  - path: skills/handoff/SKILL.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/productivity/handoff/SKILL.md
    rationale: >-
      Reference plans, issues, commits and diffs instead of duplicating them, name the skills the
      next agent should use, and redact sensitive information. The donor's document in the
      operating system's temporary directory becomes a knowledgebase run artifact.

  - path: skills/handoff/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/SKILL.md
    rationale: >-
      Triggers, non-triggers, the resume gates, the resume-orientation output and its needs-input
      stop condense the same donor text the body adapts. The one-record limit and the kb-publish
      side effect are this package's.

  - path: skills/handoff/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/references/create.md
    rationale: >-
      The decision-marking, stale-evidence, redaction and publish-confirmation gates condense the
      donor's creation rules.

  - path: skills/handoff/skill.yaml
    source: compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-handoff/references/resume.md
    rationale: >-
      The prior-handoff input, read as context rather than instructions, condenses the donor's
      resume precedence.

  - path: skills/handoff/skill.yaml
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/productivity/handoff/SKILL.md
    rationale: >-
      The run-artifacts input, pointed at and never reproduced, condenses the donor's
      reference-not-duplicate rule.

  # --- wait-what -----------------------------------------------------------------

  - path: skills/wait-what/SKILL.md
    source: pocock@c55ee46073ed923f86ce59a5eb3b6d895095d1b7:skills/productivity/wait-what/SKILL.md
    rationale: >-
      The primitive: re-pitch "that" with a little context, in Simplified Technical English, in
