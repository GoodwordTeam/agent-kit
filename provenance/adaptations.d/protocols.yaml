# Provenance fragment for the "protocols" batch: seven protocol bodies, one loose
# doctrine file, and seven role bodies.
#
# One row per (path, source) pair, keyed `path:` with a single `source:`, which is
# what loadAdaptationFragments reads (src/validation/provenance.ts). A file adapted from
# several donor files carries one row per donor file, so every upstream work a body
# derives from is recorded with a machine-checkable donor@commit:path. That is what
# NOTICE points a downstream consumer at, so an unverifiable source here would turn a
# provenance record into a provenance claim.
#
# One fragment owns each adapted path: a second fragment claiming any path below is a
# merge hazard and raises provenance.conflicting-adaptation.
#
# Donor ids and commits are those pinned in provenance/upstream.lock.yaml. Every path
# below comes from research/dossiers/protocols.md, whose citations were verified against
# the pinned working trees; none was re-derived or guessed.
#
# provenance/adaptations.yaml is generated from this directory by `ak build` and is not
# written here.
#
# Two files in this batch carry no `adaptations` row because catalog.yaml declares them
# provenance_origin: conversation. They are under `conversation_origin:` at the bottom,
# a key the fragment parser does not read.

adaptations:
  - path: protocols/invocation-authority.md
