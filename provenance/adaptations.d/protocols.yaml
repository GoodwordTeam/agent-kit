    path: protocols/phase-operations/PROTOCOL.md
    locator: G:L1668-1676
    rationale: The entrypoint / phase-operation split and the runner-validated grant that gates it
      are a design resolution, not a donor mechanism. No donor implements a generic
      grant-validation primitive.
    related_patterns:
      - compound-engineering@05c42da94fd318fa081f29d17bf947762aa477b1:skills/ce-code-review/references/finish-review.md
      - omc@5281b19e0d64f8e6dc6767f2130299a88af2dc71:skills/plan/SKILL.md
    related_patterns_note: Worked examples of phase-operation granularity and of separating a
      handoff from a terminal exit. Reinforcing analogs, never this protocol's source.
  - id: supervisor
    path: roles/supervisor/ROLE.md
    locator: G:L2038-2254
    rationale: The whole supervisor-pair proxy-user checkpoint design. No donor implements a
      two-independent-judgment checkpoint where the pair stands in for the human.
    related_patterns:
      - superpowers@b36e0829c6d0140e93cfef2ca599b1b07d4a7797:skills/subagent-driven-development/SKILL.md
    related_patterns_note: Breaker adjudication (park or rule and continue, always ledgered) is
      structurally related but is a fix-loop mechanism, not a proxy-user checkpoint. Reinforcing
      analog only.
conversation_origin_fragments:
  - path: protocols/invocation-authority.md
    locator: G:L1668-1676
    rationale: The two-list shape of the invocation law. Named in the transcript as Pocock's
      principle, but no single file in the pocock donor states a repo-wide invocation law; its
      skills scope invocation class per skill.
  - path: protocols/attach-pack/PROTOCOL.md
    locator: G:L1768-1779
    rationale: Semantic pack matching (deciding which pack is relevant from artifact and semantics
      rather than file extension) as distinct from pack resolution and loading. The donor script
      resolves a pack list that was already declared.
  - path: protocols/worktree-ownership/PROTOCOL.md
    locator: G:L1668-1676
    rationale: Overlapping writers are serialized even with no dependency edge between them. The
      worktree donors solve isolation and the dispatch donor solves prompt independence; neither
      names the write-conflict-without-an-edge case. Anchored in the plan at §5.3 and §10
      scenario 13; the G:L value here is the nearest transcript anchor for the surrounding
      dispatch-authority discussion and is NOT a locator for this rule itself. Flagged rather
      than invented.
  - path: protocols/apply-findings/PROTOCOL.md
    locator: G:L1083-1214
    rationale: Carrying spec_quality and autofix_class as two co-equal axes on one finding. Neither
      donor holds both axes on one object; the combination is this repository's synthesis of a
      transcript proposal the donor had not adopted at its pin.
