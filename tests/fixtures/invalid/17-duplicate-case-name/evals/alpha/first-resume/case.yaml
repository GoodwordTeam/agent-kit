schema_version: "1.1"
name: interrupted-publish-resumes
tags: [resumability]
execution:
  prompt: "The last run dropped before its read-back. Finish it."
  max_turns: 8
  allowed_tools: [Read, Skill]
graders:
  - name: reads-back-first
    type: llm
    focus: trace
    weight: 1
    criteria: >-
      The response reads the record back before writing it again.
